<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TheInterviewChair.com — Gift Sent</title>
<!-- Our own anonymous page-view log — BEFORE Google Analytics, same reasoning as home.html's
     own comment on this exact block (was at the bottom of the file, missed by fast navigation). -->

<script async src="https://www.googletagmanager.com/gtag/js?id=G-VWP8MJVBCH"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-VWP8MJVBCH');

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green: #34d399; --dark-green: #047857;
    --bg: #070d1a; --bg2: #0f1829; --pearl: #f1f5f9; --muted: #64748b;
    --border: rgba(255,255,255,0.08); --font: -apple-system,'Segoe UI',system-ui,sans-serif;
  }
  body {
    background: var(--bg); color: var(--pearl); font-family: var(--font);
    min-height: 100vh; -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    max-width: 440px; width: 100%; text-align: center;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 24px;
    padding: 48px 36px; box-shadow: 0 32px 80px rgba(0,0,0,0.4);
  }
  .mark {
    width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 24px;
    background: linear-gradient(135deg, var(--green), var(--dark-green));
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; box-shadow: 0 8px 24px rgba(4,120,87,0.4);
  }
  h1 { font-size: 22px; font-weight: 900; letter-spacing: -0.03em; margin-bottom: 12px; }
  p { font-size: 14px; color: var(--muted); line-height: 1.7; margin-bottom: 28px; }
  .btn {
    display: inline-block; padding: 13px 28px; border-radius: 12px;
    background: linear-gradient(135deg, var(--green), var(--dark-green));
    color: #fff; font-size: 14px; font-weight: 800; text-decoration: none;
    box-shadow: 0 6px 24px rgba(4,120,87,0.4);
  }
  .footer-note { margin-top: 24px; font-size: 12px; color: #475569; }
  .footer-note a { color: var(--green); text-decoration: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">🎁</div>
    <h1>Gift sent!</h1>
    <p id="gift-success-copy">Your payment went through and the pass is now active for your recipient — they'll be able to sign in with the email you gave us and start practicing straight away.</p>
    <a class="btn" href="/">← Back to TheInterviewChair.com</a>
    <div class="footer-note">Questions about your gift? Email <a href="mailto:francis@percentile.one">francis@percentile.one</a></div>
  </div>
  <script>
    // Best-effort personalization only — the generic copy above is left in the DOM as the
    // fallback if this fetch fails or session_id is missing, so a broken/slow API never blocks
    // the success page itself from rendering (Francis, 2026-09-16: "Danny will be able to sign
    // in..." reads much better than "they'll be able to sign in...").
    (function () {
      var params = new URLSearchParams(window.location.search);
      var sessionId = params.get('session_id');
      if (!sessionId) return;
      fetch('https://api.explain.global/api/session-passes/checkout-session/' + encodeURIComponent(sessionId))
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (data) {
          if (data && data.recipientFirstName) {
            document.getElementById('gift-success-copy').textContent =
              data.recipientFirstName + ' will be able to sign in with the email you gave us and start practicing straight away.';
          }
        })
        .catch(function () {});
    })();
  </script>
</body>
</html>
