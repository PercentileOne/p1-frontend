<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1c1a3a"/>
      <stop offset="100%" stop-color="#08070f"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6a3fcf"/>
      <stop offset="45%" stop-color="#5b8ff7"/>
      <stop offset="100%" stop-color="#6a3fcf"/>
    </linearGradient>
    <linearGradient id="eLetter" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#a0c4ff"/>
      <stop offset="100%" stop-color="#5b8ff7"/>
    </linearGradient>
    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="eGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="50" cy="50" r="49" fill="url(#bg)"/>

  <!-- Outer glow ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#ring)" stroke-width="4" opacity="0.6" filter="url(#ringGlow)"/>
  <!-- Crisp inner ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#ring)" stroke-width="1.5" opacity="0.9"/>

  <!-- E letterform — centred, bold, clean -->
  <g fill="url(#eLetter)" filter="url(#eGlow)">
    <!-- Left vertical bar -->
    <rect x="28" y="26" width="9" height="48" rx="2.5"/>
    <!-- Top horizontal bar -->
    <rect x="28" y="26" width="40" height="9" rx="2.5"/>
    <!-- Middle horizontal bar (slightly shorter) -->
    <rect x="28" y="45.5" width="32" height="9" rx="2.5"/>
    <!-- Bottom horizontal bar -->
    <rect x="28" y="65" width="40" height="9" rx="2.5"/>
  </g>
</svg>
