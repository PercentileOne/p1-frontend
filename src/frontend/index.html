<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InterviewMe.global — The World's First Interview Broadcast Platform</title>

    <!-- Open Graph / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://candidate.interviewme.global" />
    <meta property="og:title" content="InterviewMe.global — Interview Once. Get Seen by Thousands." />
    <meta property="og:description" content="The World's First Interview Broadcast Platform. One interview. Every employer. For ever." />
    <meta property="og:image" content="https://product.interviewme.global/im-social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="InterviewMe.global" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="InterviewMe.global — Interview Once. Get Seen by Thousands." />
    <meta name="twitter:description" content="The World's First Interview Broadcast Platform. One interview. Every employer. For ever." />
    <meta name="twitter:image" content="https://product.interviewme.global/im-social-card.png" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5T94QMVQG5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-5T94QMVQG5');
    </script>
    <style>
      /* Instant loading shell — shows before the JS bundle downloads/parses (worst case on a
         cross-domain redirect, e.g. AuthCallback.tsx, where there's no client-side router to
         lean on). React's createRoot(...).render() in main.tsx replaces #root's entire
         content on mount, so this markup just disappears on its own — no JS needed. */
      html, body { margin: 0; background: #07112a; }
      #root {
        min-height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        font-family: -apple-system, "Segoe UI", sans-serif;
      }
      #boot-mark {
        width: 44px; height: 44px; border-radius: 12px;
        background: linear-gradient(135deg, #34D399, #047857);
        display: flex; align-items: center; justify-content: center;
        font-size: 20px; font-weight: 900; color: #fff; letter-spacing: -0.05em;
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      #boot-text { font-size: 13px; color: rgba(240, 244, 255, 0.4); letter-spacing: 0.02em; }
      @keyframes boot-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%      { opacity: 0.6; transform: scale(0.93); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-mark { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-mark">IM</div>
      <div id="boot-text">Loading InterviewMe.global&hellip;</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
