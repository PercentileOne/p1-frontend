<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TheInterviewChair.com — The World's First Interview Broadcast Platform</title>

    <!-- Open Graph / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://candidate.theinterviewchair.com" />
    <meta property="og:title" content="TheInterviewChair.com — Practice interviewing with AI. Get interview coaching. Get that job." />
    <meta property="og:description" content="The World's First Interview Broadcast Platform. One interview. Every employer. For ever." />
    <meta property="og:image" content="https://www.theinterviewchair.com/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="TheInterviewChair.com" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TheInterviewChair.com — Practice interviewing with AI. Get interview coaching. Get that job." />
    <meta name="twitter:description" content="The World's First Interview Broadcast Platform. One interview. Every employer. For ever." />
    <meta name="twitter:image" content="https://www.theinterviewchair.com/social-card.png" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5T94QMVQG5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-5T94QMVQG5');
    </script>
    <style>
      /* Instant loading shell — shows before the JS bundle downloads/parses (worst case on a
         cross-domain redirect, e.g. AuthCallback.tsx, where there's no client-side router to
         lean on). React's createRoot(...).render() in main.tsx replaces #root's entire
         content on mount, so this markup just disappears on its own — no JS needed. */
      html, body { margin: 0; background: #07112a; }
      #root {
        min-height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        font-family: -apple-system, "Segoe UI", sans-serif;
      }
      #boot-mark {
        width: 44px; height: 44px; border-radius: 12px;
        background: linear-gradient(135deg, #34D399, #047857);
        display: flex; align-items: center; justify-content: center;
        font-size: 20px; font-weight: 900; color: #fff; letter-spacing: -0.05em;
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      #boot-text { font-size: 13px; color: rgba(240, 244, 255, 0.4); letter-spacing: 0.02em; }
      @keyframes boot-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%      { opacity: 0.6; transform: scale(0.93); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-mark { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-mark">TIC</div>
      <div id="boot-text">Loading TheInterviewChair.com&hellip;</div>
    </div>
    <script>
      /* Boot watchdog (2026-10-12). If the app's script cannot run in this browser (found live: Safari 15.6.1 cannot read it at all, so the page sat on "Loading…"
         for ever and a visitor thought the demo was broken), say so plainly after 12 seconds instead of leaving the loading screen up, and record it so it shows in the
         Activity Log. Plain old JavaScript on purpose: it has to run in the browsers the app itself cannot. #boot-text only exists until the app replaces #root. */
      (function () {
        setTimeout(function () {
          var t = document.getElementById('boot-text');
          if (!t) return;
          t.style.cssText = 'max-width:340px;text-align:center;line-height:1.6;font-size:14px;color:rgba(240,244,255,0.85);padding:0 20px';
          t.innerHTML = 'This is taking longer than it should.<br><span style="color:rgba(240,244,255,0.6)">If this screen stays, your browser may be too old for the interview room. Please update Safari or your system, or open this page in Chrome or Edge.</span><br><br><a href="" onclick="location.reload();return false" style="color:#34D399;font-weight:700">Try again</a>';
          try {
            fetch('https://api.explain.global/api/events', {
              method: 'POST', headers: { 'Content-Type': 'application/json' }, keepalive: true,
              body: JSON.stringify({ sessionId: 'boot-' + Math.random().toString(36).slice(2) + Date.now().toString(36), eventType: 'boot_stuck', page: location.pathname, portal: 'candidate', metadata: { secs: 12 } })
            });
          } catch (e) { /* nothing more to do */ }
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
