    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />

    <!-- Twitter / X card -->

    <meta name="twitter:description" content="The World's First Interview Broadcast Platform. One interview. Every employer. For ever." />
    <meta name="twitter:image" content="https://www.theinterviewchair.com/social-card.png" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5T94QMVQG5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-5T94QMVQG5');
    </script>
    <style>
      /* Instant loading shell — shows before the JS bundle downloads/parses (worst case on a
         cross-domain redirect, e.g. AuthCallback.tsx, where there's no client-side router to
         lean on). React's createRoot(...).render() in main.tsx replaces #root's entire
         content on mount, so this markup just disappears on its own — no JS needed. */
      html, body { margin: 0; background: #07112a; }
      #root {
        min-height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        font-family: -apple-system, "Segoe UI", sans-serif;
      }
      #boot-mark {
        width: 44px; height: 44px; border-radius: 12px;
        background: linear-gradient(135deg, #34D399, #047857);
        display: flex; align-items: center; justify-content: center;
        font-size: 20px; font-weight: 900; color: #fff; letter-spacing: -0.05em;
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      #boot-text { font-size: 13px; color: rgba(240, 244, 255, 0.4); letter-spacing: 0.02em; }
      @keyframes boot-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%      { opacity: 0.6; transform: scale(0.93); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-mark { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-mark">TIC</div>
      <div id="boot-text">Loading TheInterviewChair.com&hellip;</div>
    </div>
    <script>
      /* Boot guard (2026-10-12). Two jobs, in plain old JavaScript because it has to run in the very browsers the app itself cannot:
         1. If this browser is plainly too old (cannot read modern JavaScript, or has no module support), say so at once instead of leaving "Loading…" up for ever.
            Found live: a visitor on Safari 15.6.1 sat on the loading screen thinking the demo was broken, and his older iMac was worse.
         2. Otherwise, if the app has not replaced the loading text after 12 seconds, say it is taking too long and offer the same way out.
         Both are recorded (boot_too_old / boot_stuck) so they show in the Activity Log. #boot-text only exists until the app replaces #root. */
      (function () {
        function tooOld() {
          try { new Function('var o={}; o.a ||= 1; return o?.a ?? 2;'); } catch (e) { return true; }
          try { if (!('noModule' in HTMLScriptElement.prototype)) return true; } catch (e) { return true; }
          return typeof fetch === 'undefined' || typeof Promise === 'undefined';
        }
        function tell(kind) {
          try {
            fetch('https://api.theinterviewchair.com/api/events', {
              method: 'POST', headers: { 'Content-Type': 'application/json' }, keepalive: true,
              body: JSON.stringify({ sessionId: 'boot-' + Math.random().toString(36).slice(2) + Date.now().toString(36), eventType: kind, page: location.pathname, portal: 'candidate', metadata: { entryRan: !!window.__ticEntryRan, failedFile: window.__ticFailedFile || '', afterMs: Math.round(performance.now()) } })
            });
          } catch (e) { /* nothing more to do */ }
        }
        function show(old) {
          var t = document.getElementById('boot-text');
          if (!t) return false;
          var btn = 'display:inline-block;margin:6px 6px 0;padding:10px 18px;border-radius:10px;background:#34D399;color:#04120c;font-weight:800;text-decoration:none;font-size:15px';
          t.style.cssText = 'max-width:440px;text-align:center;line-height:1.6;font-size:15px;color:rgba(240,244,255,0.9);padding:0 20px';
          t.innerHTML = (old
            ? '<b style="font-size:19px;color:#fff">Your browser is too old for TheInterviewChair.com</b><br>This computer\'s browser can\'t run the interview. It takes two minutes to fix, and it\'s free: install one of these, then open this page again.'
            : '<b style="font-size:19px;color:#fff">This is taking longer than it should</b><br>Please refresh the page. If this screen stays, your browser may be too old for the interview, so try one of these (free):')
            + '<br><a href="https://www.google.com/chrome/" style="' + btn + '">Google Chrome</a><a href="https://www.mozilla.org/firefox/new/" style="' + btn + '">Firefox</a>'
            + (old ? '' : '<br><a href="" onclick="location.reload();return false" style="color:#34D399;font-weight:700;display:inline-block;margin-top:14px">Refresh the page</a>')
            + '<br><span style="display:inline-block;margin-top:14px;font-size:13px;color:rgba(240,244,255,0.55)">Still stuck? Email support@theinterviewchair.com</span>';
          return true;
        }
        // A page loaded just before or during a deploy can ask for a file that has since been replaced (the files have new names every release), and on a slow connection the big
        // main file can take longer than 12 seconds. Refresh once, automatically, when a script file fails to load or a later page's file has gone; never twice in a minute.
        function reloadOnce() {
          try {
            var last = Number(sessionStorage.getItem('tic-boot-reload') || 0);
            if (Date.now() - last < 60000) return false;
            sessionStorage.setItem('tic-boot-reload', String(Date.now()));
          } catch (e) { return false; }
          location.reload();
          return true;
        }
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (t && t.tagName === 'SCRIPT' && t.src && /\/assets\//.test(t.src)) { window.__ticFailedFile = t.src.split('/').pop(); reloadOnce(); }
        }, true);
        window.addEventListener('vite:preloadError', function () { reloadOnce(); });
        function showSlow() {
          var t = document.getElementById('boot-text');
          if (!t) return false;
          t.style.cssText = 'max-width:440px;text-align:center;line-height:1.6;font-size:15px;color:rgba(240,244,255,0.9);padding:0 20px';
          t.innerHTML = '<b style="font-size:19px;color:#fff">Still loading&hellip;</b><br>Your connection looks a little slow, so this is taking longer than usual. It should appear in a moment. If it does not, please refresh the page.'
            + '<br><a href="" onclick="location.reload();return false" style="color:#34D399;font-weight:700;display:inline-block;margin-top:14px">Refresh the page</a>';
          return true;
        }
        if (tooOld()) { if (show(true)) tell('boot_too_old'); return; }
        setTimeout(function () {
          if (!document.getElementById('boot-text')) return;
          // The main file has not even started running yet: it is still downloading. Say so, and only give up much later.
          if (!window.__ticEntryRan) {
            if (showSlow()) tell('boot_slow');
            setTimeout(function () { if (show(false)) tell('boot_stuck'); }, 28000);
            return;
          }
          if (show(false)) tell('boot_stuck');
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
