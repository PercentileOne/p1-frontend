name: Deploy product.interviewme.global → Azure SWA

on:
  push:
    branches: [main]
    paths:
      - 'src/viewme/public/**'
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - uses: actions/checkout@v4

      - name: Prepare static output
        run: |
          mkdir -p deploy-product
          # Homepage: the revamped page (2026-09-21). Rollback = copy home.html here instead.
          cp src/viewme/public/home-v2.html deploy-product/index.html
          cp src/viewme/public/mastermind-chair.png deploy-product/mastermind-chair.png
          cp src/viewme/public/the-interview-chair.png deploy-product/the-interview-chair.png
          cp src/viewme/public/recruiter-phone.jpg deploy-product/recruiter-phone.jpg
          cp src/viewme/public/recruiter-phone-2.jpg deploy-product/recruiter-phone-2.jpg
          cp src/viewme/public/coffee-hero.jpg deploy-product/coffee-hero.jpg
          cp src/viewme/public/hero-1.jpg deploy-product/hero-1.jpg
          cp src/viewme/public/hero-2.jpg deploy-product/hero-2.jpg
          cp src/viewme/public/hero-3.jpg deploy-product/hero-3.jpg
          cp src/viewme/public/interview-room-latest.png deploy-product/interview-room-latest.png
          cp src/viewme/public/hero-preview.mp4 deploy-product/hero-preview.mp4
          cp src/viewme/public/hero-preview.webm deploy-product/hero-preview.webm
          cp src/viewme/public/viewme-trade-1.png deploy-product/viewme-trade-1.png
          cp src/viewme/public/viewme-trade-2.png deploy-product/viewme-trade-2.png
          cp src/viewme/public/viewme-trade-3.png deploy-product/viewme-trade-3.png
          cp src/viewme/public/about.html deploy-product/about.html
          cp src/viewme/public/fp.html deploy-product/fp.html
          cp src/viewme/public/contact.html deploy-product/contact.html
          cp src/viewme/public/profile.html deploy-product/profile.html
          cp src/viewme/public/patent.html deploy-product/patent.html
          cp src/viewme/public/how-we-score.html deploy-product/how-we-score.html
          cp src/viewme/public/gift-interview.html deploy-product/gift-interview.html
          cp src/viewme/public/gift-interview-success.html deploy-product/gift-interview-success.html
          cp src/viewme/public/privacy.html deploy-product/privacy.html
          cp src/viewme/public/request-access.html deploy-product/request-access.html
          cp src/viewme/public/cv-salary.html deploy-product/cv-salary.html
          cp src/viewme/public/shared-cv-analysis.html deploy-product/shared-cv-analysis.html
          # Never in this list before (Francis, 2026-09-18) — every page's <script src="/track.js">
          # tag has been 404ing on this domain since the page-view logger was built, regardless of
          # where in the page it sat. Found live: a genuine 404 on https://www.theinterviewchair.com/track.js.
          cp src/viewme/public/track.js deploy-product/track.js
          mkdir -p deploy-product/patent-files
          cp src/viewme/public/patent-files/*.png deploy-product/patent-files/
          # Images used by the homepage (WebP, 2026-09-21).
          mkdir -p deploy-product/img
          cp src/viewme/public/img/*.webp deploy-product/img/
          cp src/viewme/public/staticwebapp.config.json deploy-product/staticwebapp.config.json
          cp src/viewme/public/social-card.png deploy-product/social-card.png
          cp src/viewme/public/favicon-512.png deploy-product/favicon-512.png
          cp src/viewme/public/favicon.ico deploy-product/favicon.ico
          cp src/viewme/public/favicon.svg deploy-product/favicon.svg

      - name: Deploy to Azure SWA
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PRODUCT_INTERVIEWME }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: deploy-product
          skip_app_build: true
