name: Deploy candidate.explain.global → Azure SWA (orange-island)

on:
  push:
    branches: [ main ]
    paths:
      - 'src/frontend/**'
      - '.github/workflows/deploy-candidate-portal.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/frontend/package.json

      - name: Install dependencies
        working-directory: src/frontend
        run: npm install

      - name: Type-check
        working-directory: src/frontend
        run: npx tsc -b --noEmit

      - name: Build
        working-directory: src/frontend
        env:
          VITE_EXPLAIN_API_URL:     https://api.explain.global
          VITE_OPENAI_API_KEY:      ${{ secrets.VITE_OPENAI_API_KEY }}
          VITE_ELEVENLABS_API_KEY:  ${{ secrets.VITE_ELEVENLABS_API_KEY }}
          VITE_ELEVENLABS_VOICE_HR: ${{ secrets.VITE_ELEVENLABS_VOICE_HR }}
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_ISLAND_0D2E1530F }}
          repo_token:      ${{ secrets.GITHUB_TOKEN }}
          action:          upload
          app_location:    src/frontend/dist
          api_location:    src/frontend/api
          output_location: ""
          skip_app_build:  true

  close-pull-request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_ISLAND_0D2E1530F }}
          action: close
