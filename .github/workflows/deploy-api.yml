name: Deploy TalkToLearn API

on:
  push:
    branches: [ main ]
    paths:
      - 'src/backend/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/backend/TalkToLearn.Api/TalkToLearn.Api.csproj

      - name: Build
        run: dotnet build src/backend/TalkToLearn.Api/TalkToLearn.Api.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish src/backend/TalkToLearn.Api/TalkToLearn.Api.csproj -c Release -o ./publish --no-build

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: talktolearn-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
