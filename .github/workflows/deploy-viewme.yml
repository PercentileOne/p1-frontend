name: Deploy ViewMe → Azure SWA

on:
  push:
    branches: [main]
    paths:
      - 'src/viewme/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy ViewMe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/viewme/package.json

      - name: Install dependencies
        working-directory: src/viewme
        run: npm install

      - name: Build
        working-directory: src/viewme
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_VIEWME }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: src/viewme/dist
          output_location: ""
          skip_app_build: true
