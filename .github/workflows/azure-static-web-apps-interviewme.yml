name: Deploy interviewme.global → Azure SWA

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - uses: actions/checkout@v4

      - name: Prepare static output
        run: |
          mkdir -p deploy
          cp src/viewme/public/home.html deploy/index.html
          cp src/viewme/public/mastermind-chair.png deploy/mastermind-chair.png
          cp src/viewme/public/staticwebapp.config.json deploy/staticwebapp.config.json

      - name: Deploy to Azure SWA
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_INTERVIEWME }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: deploy
          skip_app_build: true
