name: Deploy Explain.global Platform → Azure SWA

on:
  push:
    branches: [ main ]
    paths:
      - 'src/recruiter-portal/**'
      - '.github/workflows/deploy-swa.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/recruiter-portal/package.json

      - name: Install dependencies
        working-directory: src/recruiter-portal
        run: npm ci

      - name: Type-check
        working-directory: src/recruiter-portal
        run: npx tsc -b --noEmit

      - name: Build
        working-directory: src/recruiter-portal
        env:
          # VITE_ELEVENLABS_* removed — see deploy-candidate-portal.yml for why.
          VITE_EXPLAIN_API_URL: https://api.explain.global
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_EXPLAIN_GLOBAL }}
          repo_token:      ${{ secrets.GITHUB_TOKEN }}
          action:          upload
          app_location:    src/recruiter-portal/dist
          api_location:    src/recruiter-portal/api
          output_location: ""
          skip_app_build:  true

  close-pull-request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_EXPLAIN_GLOBAL }}
          action: close
