name: Deploy Explain.global Platform → Azure SWA

on:
  push:
    branches: [ main ]
    paths:
      - 'src/recruiter-portal/**'
      - '.github/workflows/deploy-swa.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and deploy Vite SPA
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install OIDC client
        run: npm install @actions/core@1.6.0 @actions/http-client

      - name: Get OIDC token
        uses: actions/github-script@v6
        id: idtoken
        with:
          script: |
            const core = require('@actions/core')
            return await core.getIDToken()
          result-encoding: string

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/recruiter-portal/package.json

      - name: Install dependencies
        working-directory: src/recruiter-portal
        run: npm ci

      - name: Type-check
        working-directory: src/recruiter-portal
        run: npx tsc -b --noEmit

      - name: Build
        working-directory: src/recruiter-portal
        env:
          VITE_OPENAI_API_KEY:        ${{ secrets.VITE_OPENAI_API_KEY }}
          VITE_ELEVENLABS_API_KEY:    ${{ secrets.VITE_ELEVENLABS_API_KEY }}
          VITE_ELEVENLABS_VOICE_HR:   ${{ secrets.VITE_ELEVENLABS_VOICE_HR }}
          VITE_ELEVENLABS_VOICE_TECH: ${{ secrets.VITE_ELEVENLABS_VOICE_TECH }}
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_ISLAND_0D2E1530F }}
          github_id_token: ${{ steps.idtoken.outputs.result }}
          repo_token:      ${{ secrets.GITHUB_TOKEN }}
          action:          upload
          app_location:    src/recruiter-portal/dist
          api_location:    src/recruiter-portal/api
          output_location: ""
          skip_app_build:  true
