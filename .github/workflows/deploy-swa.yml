name: Deploy Explain.global Platform → Azure SWA

on:
  push:
    branches: [ main ]
    paths:
      - 'src/recruiter-portal/**'
      - '.github/workflows/deploy-swa.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and deploy Vite SPA

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/recruiter-portal/package.json

      - name: Install dependencies
        working-directory: src/recruiter-portal
        run: npm ci

      - name: Type-check
        working-directory: src/recruiter-portal
        run: npx tsc -b --noEmit

      - name: Build
        working-directory: src/recruiter-portal
        env:
          VITE_OPENAI_API_KEY:        ${{ secrets.VITE_OPENAI_API_KEY }}
          VITE_ELEVENLABS_API_KEY:    ${{ secrets.VITE_ELEVENLABS_API_KEY }}
          VITE_ELEVENLABS_VOICE_HR:   ${{ secrets.VITE_ELEVENLABS_VOICE_HR }}
          VITE_ELEVENLABS_VOICE_TECH: ${{ secrets.VITE_ELEVENLABS_VOICE_TECH }}
          VITE_DID_API_KEY:           ${{ secrets.VITE_DID_API_KEY }}
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_EXPLAIN_GLOBAL }}
          repo_token:                      ${{ secrets.GITHUB_TOKEN }}
          action:                          upload
          app_location:                    src/recruiter-portal/dist
          output_location:                 ""
          skip_app_build:                  true
