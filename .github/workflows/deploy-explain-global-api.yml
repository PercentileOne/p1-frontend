name: Deploy Explain.Api → Azure App Service

on:
  push:
    branches: [ main ]
    paths:
      - 'src/backend/Explain.Api/**'
      - '.github/workflows/deploy-explain-global-api.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        working-directory: src/backend/Explain.Api
        run: dotnet restore

      - name: Build
        working-directory: src/backend/Explain.Api
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        working-directory: src/backend/Explain.Api
        run: dotnet publish --configuration Release --no-build --output ./publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: explain-global-api
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: src/backend/Explain.Api/publish
