name: Deploy cockpit.percentile.one → Azure SWA (Percentile-Cockpit)

on:
  push:
    branches: [ main ]
    paths:
      - 'src/explain-global/**'
      - '.github/workflows/deploy-cockpit-percentile-one.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/explain-global/package-lock.json

      - name: Install dependencies
        working-directory: src/explain-global
        run: npm install

      - name: Build
        working-directory: src/explain-global
        run: npm run build

      - name: Deploy to Azure Static Web Apps (Percentile-Cockpit)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PERCENTILE_COCKPIT }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location:    src/explain-global
          api_location:    ""
          output_location: dist
          skip_app_build:  true

  close-pull-request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PERCENTILE_COCKPIT }}
          action: close
