name: Deploy admin.interviewme.global → Azure SWA

on:
  push:
    branches: [ main ]
    paths:
      - 'src/admin-portal/**'
      - '.github/workflows/deploy-admin-portal.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/admin-portal/package.json

      - name: Install dependencies
        working-directory: src/admin-portal
        run: npm install

      - name: Type-check
        working-directory: src/admin-portal
        run: npx tsc -b --noEmit

      - name: Build
        working-directory: src/admin-portal
        env:
          VITE_EXPLAIN_API_URL: https://api.explain.global
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ADMIN_PORTAL }}
          repo_token:      ${{ secrets.GITHUB_TOKEN }}
          action:          upload
          app_location:    src/admin-portal/dist
          output_location: ""
          skip_app_build:  true

  close-pull-request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ADMIN_PORTAL }}
          action: close
