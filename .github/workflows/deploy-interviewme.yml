name: Deploy interviewme.global → Azure SWA

on:
  push:
    branches: [main]
    paths:
      - 'src/viewme/public/gate.html'
      - 'src/viewme/public/gate-staticwebapp.config.json'
      - '.github/workflows/deploy-interviewme.yml'
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - uses: actions/checkout@v4

      - name: Prepare gate redirect bundle
        run: |
          mkdir -p deploy-gate/login deploy-gate/register
          cp src/viewme/public/gate.html deploy-gate/index.html
          # Folder+index.html so Azure resolves /login and /register as real static files —
          # takes priority over the routes-level catch-all redirect below, more reliably than
          # a "rewrite" rule did (that 404'd in practice even though it matches documented
          # Azure SWA config syntax — not worth the time chasing why).
          cp src/viewme/public/gate.html deploy-gate/login/index.html
          cp src/viewme/public/gate.html deploy-gate/register/index.html
          cp src/viewme/public/gate-staticwebapp.config.json deploy-gate/staticwebapp.config.json

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_INTERVIEWME }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: deploy-gate
          skip_app_build: true
