name: Deploy interviewme.global → Azure SWA

on:
  push:
    branches: [main]
    paths:
      - 'src/viewme/**'
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/viewme/package-lock.json

      - name: Install dependencies
        working-directory: src/viewme
        run: npm ci

      - name: Type-check
        working-directory: src/viewme
        run: npx tsc -b --noEmit

      - name: Build
        working-directory: src/viewme
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_INTERVIEWME }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: src/viewme/dist
          skip_app_build: true
