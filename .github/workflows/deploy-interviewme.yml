name: Deploy interviewme.global → Azure SWA

on:
  push:
    branches: [main]
    paths:
      - 'src/viewme/public/gate.html'
      - 'src/viewme/public/gate-staticwebapp.config.json'
      - '.github/workflows/deploy-interviewme.yml'
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - uses: actions/checkout@v4

      - name: Prepare gate redirect bundle
        run: |
          mkdir -p deploy-gate
          cp src/viewme/public/gate.html deploy-gate/index.html
          # Flat .html files at root + a "rewrite" route + navigationFallback — mirrors the
          # already-working pattern in src/viewme/public/staticwebapp.config.json (its /about,
          # /fp, /contact routes). A nested folder+index.html approach 404'd even for the
          # literal file path; turned out navigationFallback being present/absent seems to be
          # what actually governs whether Azure serves real files here, not just routes/rewrite.
          cp src/viewme/public/gate.html deploy-gate/login.html
          cp src/viewme/public/gate.html deploy-gate/register.html
          cp src/viewme/public/gate-staticwebapp.config.json deploy-gate/staticwebapp.config.json
          # Image assets gate.html references — never copied before, hence the broken chair
          # image Francis spotted live.
          cp src/viewme/public/the-interview-chair.png deploy-gate/the-interview-chair.png
          cp src/viewme/public/interview-room-latest.png deploy-gate/interview-room-latest.png
          cp src/viewme/public/candidate-1.jpg deploy-gate/candidate-1.jpg
          cp src/viewme/public/candidate-2.jpg deploy-gate/candidate-2.jpg
          cp src/viewme/public/candidate-3.jpg deploy-gate/candidate-3.jpg
          cp src/viewme/public/candidate-4.jpg deploy-gate/candidate-4.jpg
          cp src/viewme/public/candidate5.jpg deploy-gate/candidate5.jpg
          cp src/viewme/public/candidate-6.jpg deploy-gate/candidate-6.jpg
          cp src/viewme/public/candidate-7.jpg deploy-gate/candidate-7.jpg
          cp src/viewme/public/candidate-8.jpg deploy-gate/candidate-8.jpg
          cp src/viewme/public/candidate-9.jpg deploy-gate/candidate-9.jpg
          cp src/viewme/public/candidate-10.jpg deploy-gate/candidate-10.jpg

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          # interviewme-gate replaces the original interviewme-global app, which got stuck
          # in "WaitingForDeployment" since it was created (2026-08-07) and never actually
          # activated a real deployment despite every upload reporting success — every route/
          # config fix attempted tonight was correct, the resource itself just never worked.
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_INTERVIEWME_GATE }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: deploy-gate
          skip_app_build: true
