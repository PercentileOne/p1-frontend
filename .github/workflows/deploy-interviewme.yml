name: Deploy interviewme.global → Azure SWA

on:
  push:
    branches: [main]
    paths:
      - 'src/viewme/public/**'
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - uses: actions/checkout@v4

      - name: Prepare static output
        run: |
          mkdir -p deploy
          cp src/viewme/public/gate.html deploy/index.html
          cp src/viewme/public/mastermind-chair.png deploy/mastermind-chair.png
          cp src/viewme/public/interview-preview.png deploy/interview-preview.png
          cp src/viewme/public/interview-room-latest.png deploy/interview-room-latest.png
          cp src/viewme/public/candidate-1.jpg deploy/candidate-1.jpg
          cp src/viewme/public/candidate-2.jpg deploy/candidate-2.jpg
          cp src/viewme/public/candidate-3.jpg deploy/candidate-3.jpg
          cp src/viewme/public/candidate-4.jpg deploy/candidate-4.jpg
          cp src/viewme/public/candidate5.jpg deploy/candidate5.jpg
          cp src/viewme/public/candidate-6.jpg deploy/candidate-6.jpg
          cp src/viewme/public/candidate-7.jpg deploy/candidate-7.jpg
          cp src/viewme/public/candidate-8.jpg deploy/candidate-8.jpg
          cp src/viewme/public/candidate-9.jpg deploy/candidate-9.jpg
          cp src/viewme/public/candidate-10.jpg deploy/candidate-10.jpg
          cp src/viewme/public/staticwebapp.config.json deploy/staticwebapp.config.json

      - name: Deploy to Azure SWA
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_INTERVIEWME }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: deploy
          skip_app_build: true
